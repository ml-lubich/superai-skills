[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superai-skills"
version = "0.1.0"
description = "Universal agent skills and MCP orchestration suite for macOS, Linux, and Cloud environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Misha Lubich", email = "michaelle.lubich@gmail.com" }
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "mcp>=1.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
all = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
superai-skills = "super_ai_skills.cli:main"
super-skills = "super_ai_skills.cli:main"
super-ai-skills = "super_ai_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["super_ai_skills"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/teams-mcp"]

